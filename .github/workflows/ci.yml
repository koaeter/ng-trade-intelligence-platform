name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trade_intelligence
          POSTGRES_USER: trade
          POSTGRES_PASSWORD: trade
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trade -d trade_intelligence"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://trade:trade@localhost:5432/trade_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      # The repository currently has a large pre-existing Ruff backlog.
      # Keep new security and lifecycle work gated while that backlog is
      # remediated incrementally; do not silently suppress diagnostics.
      - name: Lint security and lifecycle boundary
        run: >-
          ruff check
          infrastructure/security/keycloak.py
          infrastructure/security/keycloak_fastapi.py
          infrastructure/database/rule_set_audit_writer.py
          infrastructure/database/models.py
          infrastructure/database/repositories.py
          packages/application/requirement/rule_set_service.py
          tests/unit/infrastructure/test_keycloak_token_verifier.py
          tests/unit/infrastructure/test_keycloak_fastapi_dependency.py
          tests/unit/infrastructure/test_rule_set_audit_repository.py
          tests/unit/application/test_rule_set_service.py
      - name: Type check
        run: mypy apps packages infrastructure
      - name: Test
        run: pytest
